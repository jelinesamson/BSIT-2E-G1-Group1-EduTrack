<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="main-container">
      <!-- Left image -->
      <div class="image-side">
        <img src="Background.jpeg" alt="Background" />
      </div>

      <!-- Right form -->
      <div class="form-side">
        <div class="logo-container">
          <img src="BULSU-LOGO.png" class="logo" alt="BulSU Logo" />
          <div class="school-name fw-bold">
            <h1>EduTrack</h1>
            <p>Bulacan State University</p>
          </div>
        </div>

        <h1 class="form-title fw-bold">Log In</h1>

        <div class="form-card">
          <form id="loginForm">
            <!-- EMAIL -->
            <label for="email">Email Address *</label>
            <input type="email" id="email" placeholder="Enter your email" />
            <small class="text-danger" id="emailError"></small>

            <!-- PASSWORD -->
            <label for="password">Password *</label>
            <div style="position: relative">
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
              />
              <span class="toggleEye" id="togglePassword">
                <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
                  <path
                    d="M12 5C7 5 2.73 8.11 1 12C2.73 15.89 7 19 12 19C17 19 21.27 15.89 23 12C21.27 8.11 17 5 12 5ZM12 17C9.24 17 7 14.76 7 12C7 9.24 9.24 7 12 7C14.76 7 17 9.24 17 12C17 14.76 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12C15 10.34 13.66 9 12 9Z"
                    fill="#555"
                  />
                </svg>
              </span>
            </div>
            <small class="text-danger" id="passwordError"></small>

            <!-- GENERAL ERROR -->
            <small class="text-danger" id="loginError"></small>

            <div class="form-row">
              <label class="checkbox">
                <input type="checkbox" />
                <span>Remember me</span>
              </label>
              <a href="#" class="forgot">Forgot Password?</a>
            </div>

            <button type="submit" id="loginBtn" class="btn" disabled>
              Log In
            </button>
          </form>

          <p class="signup">
            Don’t have an account?
            <a href="register.html">Sign up</a>
          </p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
