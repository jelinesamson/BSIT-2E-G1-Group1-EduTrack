<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <title>Register</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="main-container">
      <!-- Left image -->
      <div class="image-side">
        <img src="Background.jpeg" alt="Background" />
      </div>

      <!-- Right form -->
      <div class="form-side">
        <div class="logo-container">
          <img src="BULSU-LOGO.png" class="logo" alt="BulSU Logo" />
          <div class="school-name fw-bold">
            <h1>EduTrack</h1>
            <p>Bulacan State University</p>
          </div>
        </div>
        
        <h1 class="form-title fw-bold">Register</h1>

       <div class="form-card">
          <form id="registerForm" novalidate>
            <div class="input-group">
              <label>Full Name <span>*</span></label>
              <input type="text" id="fullName" placeholder="Juan Dela Cruz" />
              <small class="error"></small>
            </div>

            <div class="input-group">
              <label>Email Address <span>*</span></label>
              <input type="email" id="email" placeholder="example@email.com" />
              <small class="error"></small>
            </div>

            </form>

	        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
