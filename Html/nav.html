<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/Css/nav.css" />
    <link rel="stylesheet" href="/Css/home.css" />
    <link rel="stylesheet" href="/Css/about.css" />
    <link rel="stylesheet" href="/Css/services.css" />
    <link rel="stylesheet" href="/Css/gallery.css" />
    <link rel="stylesheet" href="/Css/contact.css" />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <nav class="navbar shadow-sm p-3 navbar-expand-lg nav-custom fixed-top">
      <div class="container-fluid">
        <a class="nav-tittle fw-bold" href="#">EduTrack</a>

        <div class="d-flex d-lg-none ms-auto align-items-center gap-2">
          <button
            type="button"
            class="btn btn-outline-primary btn-sm"
            data-bs-toggle="modal"
            data-bs-target="#loginModal"
          >
            Log In
          </button>
          <button
            class="btn btn-outline-success btn-sm"
            data-bs-toggle="modal"
            data-bs-target="#signupModal"
          >
            Sign Up
          </button>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mx-auto gap-lg-5">
            <li class="nav-item">
              <a class="nav-link" href="/Html/index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/Html/about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/Html/services.html">Services</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/Html/gallery.html">Gallery</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/Html/contact.html">Contact</a>
            </li>
          </ul>
        </div>

        <div class="d-none d-lg-flex ms-lg-auto gap-2">
          <button
            type="button"
            class="btn btn-outline-primary"
            data-bs-toggle="modal"
            data-bs-target="#loginModal"
          >
            Log In
          </button>
          <button
            type="button"
            class="btn btn-outline-success"
            data-bs-toggle="modal"
            data-bs-target="#signupModal"
          >
            Sign Up
          </button>
        </div>
      </div>
    </nav>
    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered glass-modal-dialog">
        <div class="modal-content glass-modal">
          <div class="modal-header border-0">
            <h5 class="modal-title w-100 text-center">Log In</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <label class="form-label fw-bold">Email</label>
            <input
              type="email"
              class="form-control mt-1"
              placeholder="E-mail"
              id="loginEmail"
            />

            <small id="loginEmailErr" class="text-danger"></small>
            <br />

            <label class="form-label fw-bold">Password</label>
            <input
              type="password"
              class="form-control mt-1"
              placeholder="Password"
              id="loginPassword"
            />

            <small id="loginPassErr" class="text-danger"></small>

            <p class="small text-center">
              Don't have an account yet?
              <a
                href="#"
                class="text-info"
                data-bs-toggle="modal"
                data-bs-target="#signupModal"
                data-bs-dismiss="modal"
                >Register here...</a
              >
            </p>

            <button
              class="btn btn-primary w-100 mb-2"
              onclick="return validateLogin();"
            >
              Login
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Sign Up Modal -->
    <div class="modal fade" id="signupModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered glass-modal-dialog">
        <div class="modal-content glass-modal">
          <div class="modal-header border-0">
            <h5 class="modal-title w-100 text-center">Sign Up</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <label class="form-label fw-bold">First Name</label>
            <input
              type="text"
              class="form-control mt-1"
              placeholder="First Name"
              id="signupFirstN"
            />

            <small id="signupFirstNErr" class="text-danger"></small>
            <br />

            <label class="form-label fw-bold">Last Name</label>
            <input
              type="text"
              class="form-control mt-1"
              placeholder="Last Name"
              id="signupLastN"
            />

            <small id="signupLastNErr" class="text-danger"></small>
            <br />

            <label class="form-label fw-bold">Email</label>
            <input
              type="email"
              class="form-control mt-1"
              placeholder="E-mail"
              id="signupEmail"
            />

            <small id="signupEmailErr" class="text-danger"></small>
            <br />

            <label class="form-label fw-bold">Password</label>
            <input
              type="password"
              class="form-control mt-1"
              placeholder="Password"
              id="signupPassword"
            />

            <small id="signupPassErr" class="text-danger"></small>
            <br />

            <p class="small text-center">
              Already have an account?
              <a
                href="#"
                class="text-info"
                data-bs-toggle="modal"
                data-bs-target="#loginModal"
                data-bs-dismiss="modal"
                >Log in here...</a
              >
            </p>

            <button
              class="btn btn-success w-100 mb-2"
              onclick="return validateSignup();"
            >
              Sign Up
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
